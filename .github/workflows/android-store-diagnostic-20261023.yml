name: Read NITIDO Play versions and Android crash issue metadata
on:
  push:
    branches: [codex/nitido-push-20261022]
    paths: ['.github/workflows/android-store-diagnostic-20261023.yml', 'scripts/android-store-diagnostic.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet google-auth requests
      - name: Inspect exact existing app with available NITIDO identity
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/android-store-diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-store-diagnostic-metadata
          path: android-store-diagnostic.json
