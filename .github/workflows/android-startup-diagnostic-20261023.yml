name: Android previous and current candidate startup diagnostic (no publishing)
on:
  push:
    branches: [codex/nitido-push-20261022]
    paths: ['.github/workflows/android-startup-diagnostic-20261023.yml', 'scripts/android-startup-smoke.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            version: 25
            run: 39685213359
            artifact: nitido-android-1.0.2-code25-signed-candidate
            sha256: b887388fc52d5846f36374aafa28c5af94af2a120b814ce3f224c7cf36e33e4f
          - api: 36
            version: 25
            run: 39685213359
            artifact: nitido-android-1.0.2-code25-signed-candidate
            sha256: b887388fc52d5846f36374aafa28c5af94af2a120b814ce3f224c7cf36e33e4f
          - api: 35
            version: 26
            run: 39965743634
            artifact: nitido-android-release-aab
            sha256: fa77f2dc4f7ef4f4b353911143d00f7e47d9213399b796f2e0e0a5f5a0816439
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact immutable previous or current candidate
        uses: actions/download-artifact@v4
        with:
          repository: Nelu251174/nitido
          run-id: ${{ matrix.run }}
          name: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify immutable AAB and prepare disposable emulator APK
        env:
          CANDIDATE_SHA256: ${{ matrix.sha256 }}
        run: |
          echo "$CANDIDATE_SHA256  candidate/app-release.aab" | sha256sum --check --status
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-only.jks" -storepass emulator-only -alias emulator-only -keypass emulator-only -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Disposable NITIDO emulator test"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=candidate/app-release.aab --output=candidate/test.apks --mode=universal --overwrite --ks="$RUNNER_TEMP/emulator-only.jks" --ks-pass=pass:emulator-only --ks-key-alias=emulator-only --key-pass=pass:emulator-only
          unzip -q candidate/test.apks universal.apk -d candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Three cold starts and warm resumes on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install candidate/universal.apk
            python3 scripts/android-startup-smoke.py
      - name: Retain sanitized no-account startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-code-${{ matrix.version }}-api-${{ matrix.api }}
          path: android-startup-proof
          if-no-files-found: ignore
