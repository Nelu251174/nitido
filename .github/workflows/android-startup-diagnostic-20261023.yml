name: Android candidate cold-start diagnostic (no publishing)
on:
  push:
    branches: [codex/nitido-push-20261022]
    paths: ['.github/workflows/android-startup-diagnostic-20261023.yml', 'scripts/android-startup-smoke.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact previously verified candidate 26
        uses: actions/download-artifact@v4
        with:
          repository: Nelu251174/nitido
          run-id: 39965743634
          name: nitido-android-release-aab
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify immutable AAB and prepare disposable emulator APK
        run: |
          echo 'fa77f2dc4f7ef4f4b353911143d00f7e47d9213399b796f2e0e0a5f5a0816439  candidate/app-release.aab' | sha256sum --check --status
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=candidate/app-release.aab --output=candidate/test.apks --mode=universal --overwrite
          unzip -q candidate/test.apks universal.apk -d candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Three cold starts and warm resumes on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install candidate/universal.apk
            python3 scripts/android-startup-smoke.py
      - name: Retain sanitized no-account startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-api-${{ matrix.api }}
          path: android-startup-proof
          if-no-files-found: ignore
