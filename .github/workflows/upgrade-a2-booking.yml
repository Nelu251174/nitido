name: NITIDO upgrade A2 offer booking regression
on:
  push:
    branches: [feat/nitido-upgrade-a2-offer-booking]
  pull_request:
    branches: [feat/nitido-upgrade-a2-margin-controls, feat/nitido-pro-production-v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        timezone: [UTC, Europe/Bucharest]
    env:
      TZ: ${{ matrix.timezone }}
      NITIDO_SEED_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:upgrade:a2-booking
      - run: npx next typegen
      - run: npx tsc --noEmit
