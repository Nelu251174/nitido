name: Robot TestFlight (iOS)

# Construiește varianta iOS a aplicației NITIDO (Capacitor) pe o mașină macOS
# din cloud. Upload TestFlight este explicit și condiționat de dovezi. Semnare automată prin cheia API App Store
# Connect (fără certificate manuale).
#
# Pornire: push pe branch-ul „release-ios" (sau manual din Actions).
#
# SECRETE necesare (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                     – Team ID (Apple Developer → Membership)
#   APP_STORE_CONNECT_KEY_ID          – Key ID al cheii API
#   APP_STORE_CONNECT_ISSUER_ID       – Issuer ID (App Store Connect → Keys)
#   APP_STORE_CONNECT_API_KEY         – conținutul fișierului .p8 (text simplu, lipit direct)
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Explicit integer above the current authenticated Apple build maximum
        type: string
        default: ''
      marketing_version:
        type: string
        default: '1.0'
      upload_testflight:
        description: Upload to App Store Connect for TestFlight after release gates (not public App Store submission)
        type: boolean
        default: false
      evidence_json:
        description: Fresh public release receipts JSON (no credentials; exact candidate SHA)
        type: string
        default: ''
  push:
    branches:
      - "release-ios"

permissions:
  contents: read
jobs:
  ios:
    # Nucleul Capacitor (framework precompilat) e construit cu Swift 6.2, deci
    # avem nevoie de un Xcode recent. macos-14 vine cu Xcode 15.4 (Swift 5.10),
    # care nu poate citi framework-ul → simboluri „lipsă" false (reject/getString).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Verifică secretele Apple
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          I: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=""
          [ -z "$T" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$K" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$I" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$P" ] && missing="$missing APP_STORE_CONNECT_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secretele Apple:$missing. Adaugă-le în Settings → Secrets → Actions."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalează dependințele
        run: npm ci

      - name: Sync Capacitor (iOS) — producție
        env:
          NITIDO_NATIVE_SERVER_URL: https://nitido.ro
        run: |
          npx cap sync ios
          node -e 'const c=require("./ios/App/App/capacitor.config.json");if(c.appId!=="ro.nitido.app"||c.server.url!=="https://nitido.ro")throw Error("Invalid TestFlight target");'

      - name: Resolve release versions and verify installed SDK
        env:
          REQUESTED: ${{ inputs.build_number }}
          MARKETING: ${{ inputs.marketing_version || '1.0' }}
        run: |
          BUILD_NUMBER="${REQUESTED:-$GITHUB_RUN_NUMBER}"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] && [ "$BUILD_NUMBER" -gt 12 ] || { echo 'Build must exceed verified historical Apple build12'; exit 1; }
          [[ "$MARKETING" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          echo "NITIDO_IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "NITIDO_MARKETING_VERSION=$MARKETING" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Pregătește cheia API App Store Connect
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY" > "$ASC_KEY_PATH"

      - name: Authenticate exact Apple app and current build maximum
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 scripts/mobile-apple-preflight.py

      - name: Archive (semnare automată)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$NITIDO_IOS_BUILD_NUMBER" \
            MARKETING_VERSION="$NITIDO_MARKETING_VERSION" \
            clean archive

      - name: Creează ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Exportă .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify exported IPA signature and provisioning
        run: |
          IPA_FILES=("$RUNNER_TEMP"/export/*.ipa)
          [ "${#IPA_FILES[@]}" -eq 1 ] || exit 1
          python3 scripts/mobile-verify-ios.py "${IPA_FILES[0]}" "$NITIDO_IOS_BUILD_NUMBER" "$NITIDO_MARKETING_VERSION"

      - name: Prepare public release receipts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
        env:
          RELEASE_EVIDENCE: ${{ inputs.evidence_json }}
        run: |
          umask 077
          printf '%s' "$RELEASE_EVIDENCE" > "$RUNNER_TEMP/mobile-release-evidence.json"

      - name: Refresh Apple store state before requested upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
        env:
          EVIDENCE: ${{ runner.temp }}/mobile-release-evidence.json
          VERIFY_UPLOAD_EVIDENCE: 'true'
        run: python3 scripts/mobile-apple-preflight.py

      - name: Gate actual TestFlight upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
        env:
          EVIDENCE: ${{ runner.temp }}/mobile-release-evidence.json
        run: node scripts/mobile-release-gate.mjs "$EVIDENCE" ios "$GITHUB_SHA" "$NITIDO_IOS_BUILD_NUMBER" beta

      - name: Publică .ipa ca artefact
        uses: actions/upload-artifact@v4
        with:
          name: nitido-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Urcă pe TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary Apple API key
        if: ${{ always() }}
        run: rm -f "$ASC_KEY_PATH"
