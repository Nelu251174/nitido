name: Export completed UI catalogs through existing Coolify access
on:
  push:
    branches: [codex/nitido-translations-20261023]
    paths:
      - .github/workflows/ui-catalog-export-20261024.yml
      - scripts/i18n-export-generated.mjs
      - scripts/i18n-export-generated.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nitido-ui-catalog-export-20261024
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test artifact filtering and permission failures without external calls
        run: node --test scripts/i18n-export-generated.test.mjs
      - name: Read only the completed repository UI catalogs; do not create services
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: node scripts/i18n-export-generated.mjs
      - name: Validate the complete exported catalogs
        run: node scripts/i18n-validate.mjs .translation-work/generated-catalogs
      - uses: actions/upload-artifact@v4
        with:
          name: nitido-ui-catalogs-20261024
          path: .translation-work/generated-catalogs/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
