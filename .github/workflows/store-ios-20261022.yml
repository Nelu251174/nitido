name: NITIDO iOS 1.0.2 build 19 — verified source upload

# One authorized release. Build the exact healthy production source, keep Apple
# credentials within the macOS runner, retain the existing beta release gate,
# and select the processed build in the owner's 1.0.2 draft. No App Review submission.
on:
  push:
    branches: [codex/store-ios-initial-20261022]
    paths:
      - .github/workflows/store-ios-20261022.yml
      - scripts/ios19-release-control.py
      - scripts/ios19-submit-review.py
      - docs/store/store-live-receipt-20261022.json

permissions:
  contents: read
jobs:
  ios:
    # Nucleul Capacitor (framework precompilat) e construit cu Swift 6.2, deci
    # avem nevoie de un Xcode recent. macos-14 vine cu Xcode 15.4 (Swift 5.10),
    # care nu poate citi framework-ul → simboluri „lipsă" false (reject/getString).
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: nitido-ios-1-0-2-build19
      cancel-in-progress: false
    defaults:
      run:
        working-directory: source
    env:
      NITIDO_SOURCE_SHA: 5a5d1b0eece25f1233a448f15ca9cfa385a1d8d4
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout exact verified production source
        uses: actions/checkout@v4
        with:
          ref: 5a5d1b0eece25f1233a448f15ca9cfa385a1d8d4
          path: source
          persist-credentials: false

      - name: Checkout this release's controller and public production receipt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false
          sparse-checkout: |
            scripts/ios19-release-control.py
            scripts/ios19-submit-review.py
            scripts/ios19-release-control.test.py
            scripts/ios19-submit-review.test.py
            scripts/ios19-metadata.test.py
            docs/store/store-live-receipt-20261022.json
          sparse-checkout-cone-mode: false

      - name: Retrieve the existing approved large-phone screenshots
        uses: actions/checkout@v4
        with:
          ref: af5be0036d313dd60a04b71142922945aec45b54
          path: approved-assets
          persist-credentials: false
          sparse-checkout: docs/store/ios-1.0.1-screenshots

      - name: Test release selection, idempotence and metadata mutation guards offline
        run: |
          python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-release-control.test.py"
          python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-submit-review.test.py"
          python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-metadata.test.py"

      - name: Verifică secretele Apple
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          I: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=""
          [ -z "$T" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$K" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$I" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$P" ] && missing="$missing APP_STORE_CONNECT_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secretele Apple:$missing. Adaugă-le în Settings → Secrets → Actions."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalează dependințele
        run: npm ci

      - name: Sync Capacitor (iOS) — producție
        env:
          NITIDO_NATIVE_SERVER_URL: https://nitido.ro
        run: |
          npx cap sync ios
          node -e 'const c=require("./ios/App/App/capacitor.config.json");if(c.appId!=="ro.nitido.app"||c.server.url!=="https://nitido.ro")throw Error("Invalid TestFlight target");'

      - name: Resolve release versions and verify installed SDK
        env:
          REQUESTED: '19'
          MARKETING: '1.0.2'
        run: |
          [ "$(git rev-parse HEAD)" = "$NITIDO_SOURCE_SHA" ] || exit 1
          BUILD_NUMBER="$REQUESTED"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] && [ "$BUILD_NUMBER" -gt 12 ] || { echo 'Build must exceed verified historical Apple build12'; exit 1; }
          [[ "$MARKETING" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          echo "NITIDO_IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "NITIDO_MARKETING_VERSION=$MARKETING" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Pregătește cheia API App Store Connect
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY" > "$ASC_KEY_PATH"

      - name: Authenticate exact Apple app and current build maximum
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 scripts/mobile-apple-preflight.py

      - name: Archive without a development device profile
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$NITIDO_IOS_BUILD_NUMBER" \
            MARKETING_VERSION="$NITIDO_MARKETING_VERSION" \
            clean archive

      - name: Preserve push entitlement for distribution export
        run: |
          # The unsigned archive has no signing entitlement blob. Seed its
          # declared push capability with an intermediate ad-hoc signature so
          # Xcode's distribution export preserves it. This is not the IPA's
          # final signature: export uses the existing Apple distribution identity.
          codesign --force --sign - \
            --entitlements ios/App/App/App.entitlements \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"

      - name: Creează ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      # App Store distribution signing happens during export. An automatically
      # signed archive would first request a development profile and registered
      # devices, which this distribution-only team does not have. The exported
      # IPA still has to pass the signature and provisioning checks below.
      - name: Export and sign App Store IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify signed IPA and prepare fresh beta release evidence
        env:
          LIVE_RECEIPT: ${{ github.workspace }}/release-control/docs/store/store-live-receipt-20261022.json
        run: python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-release-control.py" evidence

      - name: Refresh Apple state and enforce existing source release gate
        env:
          EVIDENCE: ${{ runner.temp }}/ios19-release-evidence.json
          VERIFY_UPLOAD_EVIDENCE: 'true'
        run: |
          python3 scripts/mobile-apple-preflight.py
          node scripts/mobile-release-gate.mjs "$EVIDENCE" ios "$NITIDO_SOURCE_SHA" "$NITIDO_IOS_BUILD_NUMBER" beta

      - name: Retain signed IPA and public evidence
        uses: actions/upload-artifact@v4
        with:
          name: nitido-ios-1.0.2-build19
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/ios19-release-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare only the new Apple version and preserve approved listing metadata
        env:
          IOS19_SCREENSHOTS: ${{ github.workspace }}/approved-assets/docs/store/ios-1.0.1-screenshots
        run: python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-submit-review.py" prepare

      - name: Upload the verified 1.0.2 (19) IPA to App Store Connect
        run: |
          IPA_FILES=("$RUNNER_TEMP"/export/*.ipa)
          [ "${#IPA_FILES[@]}" -eq 1 ] || exit 1
          xcrun altool --upload-app -f "${IPA_FILES[0]}" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Confirm Apple processing, three screenshots and select the draft build
        run: python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-release-control.py" confirm

      - name: Submit only the verified update for App Review
        env:
          IOS19_EVIDENCE: ${{ runner.temp }}/ios19-release-evidence.json
          IOS19_SCREENSHOTS: ${{ github.workspace }}/approved-assets/docs/store/ios-1.0.1-screenshots
        run: python3 "$GITHUB_WORKSPACE/release-control/scripts/ios19-submit-review.py"

      - name: Retain public release receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nitido-ios19-public-receipts
          path: |
            ${{ runner.temp }}/ios19-release-evidence.json
            ${{ runner.temp }}/ios19-apple-confirmation.json
            ${{ runner.temp }}/ios19-draft-prepared.json
            ${{ runner.temp }}/ios19-app-review-confirmation.json
            ${{ runner.temp }}/ios19-review-progress.json
            ${{ runner.temp }}/ios19-large-screenshots.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary Apple API key
        if: ${{ always() }}
        run: rm -f "$ASC_KEY_PATH"
