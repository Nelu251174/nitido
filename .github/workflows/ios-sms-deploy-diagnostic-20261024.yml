name: Read selected NITIDO SMS deployment errors
on:
  workflow_dispatch:
  push:
    branches: [codex/nitido-ios-sms-20261024]
    paths: [.github/workflows/ios-sms-deploy-diagnostic-20261024.yml, scripts/ios-sms-deploy-diagnostic-20261024.mjs]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read only infrastructure errors of the exact failed deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: node scripts/ios-sms-deploy-diagnostic-20261024.mjs
