name: NITIDO iOS 17 review correction — verified TestFlight upload
on:
  push:
    branches: [codex/ios-review-upload-20261012]
    paths: [.github/workflows/ios-review-upload.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: nitido-testflight-upload-existing-app
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      NITIDO_SOURCE_SHA: 7480c0462e75a85fd7819ed5be86963071eb388f
      NITIDO_IOS_BUILD_NUMBER: '17'
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          ref: 7480c0462e75a85fd7819ed5be86963071eb388f
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apple authentication library
        run: python -m pip install pyjwt cryptography
      - name: Authenticate artifact source and download the signed build
        run: |
          test "$(git -C app rev-parse HEAD)" = "$NITIDO_SOURCE_SHA"
          for RUN in 38279163659 38279177163; do
            test "$(gh api "repos/Nelu251174/nitido/actions/runs/$RUN" --jq '.head_sha')" = "$NITIDO_SOURCE_SHA"
            test "$(gh api "repos/Nelu251174/nitido/actions/runs/$RUN" --jq '.conclusion')" = success
          done
          test "$(gh api repos/Nelu251174/nitido/actions/artifacts/11761025185 --jq '.workflow_run.head_sha')" = "$NITIDO_SOURCE_SHA"
          gh run download 38279163659 --repo Nelu251174/nitido --name nitido-ios-ipa --dir "$RUNNER_TEMP/nitido-ios"
          echo "EVIDENCE=$RUNNER_TEMP/mobile-release-evidence.json" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Verify signed IPA and prepare fresh release receipts
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          python app/scripts/mobile-verify-ios.py "$RUNNER_TEMP/nitido-ios/App.ipa" "$NITIDO_IOS_BUILD_NUMBER" 1.0
          umask 077
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY" > "$ASC_KEY_PATH"
          python ops/scripts/ios-review-upload-prepare.py
          node app/scripts/mobile-release-gate.mjs "$EVIDENCE" ios "$NITIDO_SOURCE_SHA" "$NITIDO_IOS_BUILD_NUMBER" beta
      - name: Upload corrected build to App Store Connect for TestFlight
        run: |
          python app/scripts/mobile-apple-preflight.py
          xcrun altool --upload-app -f "$RUNNER_TEMP/nitido-ios/App.ipa" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Preserve release receipt
        uses: actions/upload-artifact@v4
        with:
          name: nitido-ios-17-testflight-receipt
          path: ${{ runner.temp }}/mobile-release-evidence.json
          if-no-files-found: error
      - name: Wait for Apple processing and prepare the rejected review version
        run: python ops/scripts/ios-review-select-build.py
      - name: Preserve Apple processing and version-selection receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nitido-ios-17-processing-state
          path: ${{ runner.temp }}/ios-review-build-state.json
          if-no-files-found: warn
      - name: Remove temporary Apple key
        if: ${{ always() }}
        run: rm -f "$ASC_KEY_PATH"
