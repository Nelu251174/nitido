name: Read existing NITIDO App Store publication readiness
on:
  workflow_dispatch:
  push:
    branches: [codex/nitido-ios-sms-20261024]
    paths: [.github/workflows/ios-store-readiness-20261024.yml, scripts/ios-store-readiness-20261024.mjs]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check only the existing NITIDO app, without creating builds or releases
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node scripts/ios-store-readiness-20261024.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nitido-ios-store-readiness-20261024
          path: .ios-store-readiness/readiness.json
          include-hidden-files: true
          retention-days: 1
