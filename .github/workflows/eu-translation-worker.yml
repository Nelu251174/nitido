name: Authorized EU translation worker
on:
  push:
    branches: [codex/eu-translation-worker-20261014]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing credential bindings without exposing values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          node -e 'console.log(JSON.stringify({openaiConfigured:Boolean(process.env.OPENAI_API_KEY),coolifyConfigured:Boolean(process.env.COOLIFY_TOKEN)}))'
