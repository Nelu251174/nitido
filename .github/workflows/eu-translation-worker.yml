name: Authorized EU translation worker
on:
  push:
    branches: [codex/eu-translation-worker-20261014]
permissions:
  contents: read
concurrency:
  group: nitido-owner-approved-private-translations
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 245
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .translation-tools --ignore-scripts @actions/artifact@4.0.0
      - uses: actions/github-script@v7
        env:
          NITIDO_TRANSLATION_PROBE: 'true'
        with:
          script: |
            await require('./scripts/i18n-artifact-worker.cjs')({core});
