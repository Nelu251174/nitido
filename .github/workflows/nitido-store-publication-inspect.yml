name: NITIDO current store access and distribution state
on:
  push:
    branches: [codex/nitido-store-publication]
    paths:
      - .github/workflows/nitido-store-publication-inspect.yml
      - scripts/store-publication-inspect.py
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official authentication libraries
        run: python -m pip install pyjwt cryptography google-auth requests
      - name: Inspect existing app without changing a release track
        env:
          STORE_PLATFORM: ${{ matrix.platform }}
          STORE_REPORT: ${{ runner.temp }}/store-${{ matrix.platform }}.json
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/store-publication-inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-store-${{ matrix.platform }}
          path: ${{ runner.temp }}/store-${{ matrix.platform }}.json
          if-no-files-found: error
