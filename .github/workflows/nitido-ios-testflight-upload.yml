name: NITIDO verified iPhone upload to TestFlight
on:
  push:
    branches: [codex/nitido-store-publication]
    paths:
      - .github/workflows/nitido-ios-testflight-upload.yml
      - scripts/store-ios-upload-prepare.py
      - docs/store/ios-testflight-evidence.json
permissions:
  contents: read
  actions: read
concurrency:
  group: nitido-testflight-upload-existing-app
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      NITIDO_SOURCE_SHA: be6b421015739dcbcc67eaa2234fd9fcb8ec7dc4
      NITIDO_IOS_BUILD_NUMBER: '16'
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/mobile-release-evidence.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          ref: be6b421015739dcbcc67eaa2234fd9fcb8ec7dc4
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Apple authentication dependencies
        run: python -m pip install pyjwt cryptography
      - name: Verify exact successful source provenance and download signed IPA
        run: |
          test "$(git -C app rev-parse HEAD)" = "$NITIDO_SOURCE_SHA"
          for RUN in 37971466646 37957420729; do
            test "$(gh api "repos/Nelu251174/nitido/actions/runs/$RUN" --jq '.head_sha')" = "$NITIDO_SOURCE_SHA"
            test "$(gh api "repos/Nelu251174/nitido/actions/runs/$RUN" --jq '.conclusion')" = success
          done
          gh run download 37971466646 --repo Nelu251174/nitido --name nitido-ios-ipa --dir "$RUNNER_TEMP/nitido-ios"
          echo '38cb776396b2960109ed9cdfcb6cadbef0dbb288390d147bf330a7bc4d1b5288  '"$RUNNER_TEMP/nitido-ios/App.ipa" | shasum -a 256 --check
      - name: Verify signed app, current HTTPS backend and fresh Apple account
        run: |
          python app/scripts/mobile-verify-ios.py "$RUNNER_TEMP/nitido-ios/App.ipa" "$NITIDO_IOS_BUILD_NUMBER" 1.0
          python - <<'PY'
          import json,os,urllib.request,pathlib
          with urllib.request.urlopen('https://nitido.ro/api/health',timeout=20) as r:
              assert r.status==200 and json.load(r)['status']=='ok'
          for path in ['/termeni','/confidentialitate','/stergere-cont']:
              with urllib.request.urlopen('https://nitido.ro'+path,timeout=20) as r:
                  text=r.read().decode();assert r.status==200
                  if path!='/stergere-cont':assert 'ATP SPEDITION SL' in text and 'B21732383' in text
          pathlib.Path(os.environ['EVIDENCE']).write_bytes(pathlib.Path('ops/docs/store/ios-testflight-evidence.json').read_bytes())
          PY
          python ops/scripts/store-ios-upload-prepare.py
          node app/scripts/mobile-release-gate.mjs "$EVIDENCE" ios "$NITIDO_SOURCE_SHA" "$NITIDO_IOS_BUILD_NUMBER" beta
      - name: Upload verified existing build to App Store Connect for TestFlight
        run: |
          umask 077
          mkdir -p "$HOME/private_keys"
          python - <<'PY'
          import pathlib,os
          path=pathlib.Path.home()/'private_keys'/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          path.write_text(os.environ['ASC_PRIVATE_KEY']);path.chmod(0o600)
          PY
          xcrun altool --upload-app -f "$RUNNER_TEMP/nitido-ios/App.ipa" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Preserve public beta upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: nitido-ios-testflight-upload-receipt
          path: ${{ runner.temp }}/mobile-release-evidence.json
          if-no-files-found: error
      - name: Remove temporary Apple key
        if: ${{ always() }}
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
