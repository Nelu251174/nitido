name: NITIDO current Apple and Google release access
on:
  push:
    branches: [codex/store-update-20261022]
    paths:
      - .github/workflows/store-inspect-20261022.yml
      - scripts/store-inspect-20261022.py
permissions:
  contents: read
jobs:
  current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install API clients
        run: python3 -m pip install --quiet pyjwt cryptography google-auth requests
      - name: Inspect exact existing apps without a release mutation
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          NITIDO_KEYSTORE_BASE64: ${{ secrets.NITIDO_KEYSTORE_BASE64 }}
          NITIDO_KEYSTORE_PASSWORD: ${{ secrets.NITIDO_KEYSTORE_PASSWORD }}
        run: python3 scripts/store-inspect-20261022.py
      - name: Keep only public release status
        uses: actions/upload-artifact@v4
        with:
          name: nitido-current-store-state
          path: ${{ runner.temp }}/nitido-current-store-state.json
          if-no-files-found: error
          retention-days: 7
