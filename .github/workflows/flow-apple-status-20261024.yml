name: Read Apple state during NITIDO flow verification
on:
  workflow_dispatch:
  push:
    branches: [codex/nitido-flow-validation-20261024]
    paths: [.github/workflows/flow-apple-status-20261024.yml]
permissions:
  contents: read
jobs:
  apple-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read only current status of the existing public app and submitted update
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node scripts/mobile-apple-status.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nitido-flow-apple-state-20261024
          path: apple-store-status.json
          retention-days: 1
