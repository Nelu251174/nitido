name: Prepare encrypted NITIDO Firebase configuration for server installation
on:
  push:
    branches: [codex/nitido-push-20261022]
    paths: ['scripts/firebase-credential-transfer*', 'scripts/firebase-transfer-recipient.pem', '.github/workflows/firebase-credential-transfer-20261023.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify configuration identity, temporary credential cleanup and encryption
        run: node --test scripts/mobile-firebase-config.test.mjs scripts/push-firebase-provision.test.mjs scripts/firebase-credential-transfer.test.mjs
      - name: Retrieve the exact Android SDK configuration and encrypt credentials for the server operator
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/firebase-credential-transfer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nitido-firebase-configuration-encrypted
          path: |
            firebase-configuration.encrypted.json
            firebase-transfer-status.json
          retention-days: 1
          if-no-files-found: error
