name: Verify secured NITIDO APNs key and prepare encrypted runtime configuration
on:
  push:
    branches: [codex/nitido-push-20261022]
    paths: ['scripts/apns-credential-transfer*', 'scripts/apns-transfer-recipient.pem', '.github/workflows/apns-credential-check-20261023.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test key validation, team binding and authenticated encryption
        run: node --test scripts/apns-credential-transfer.test.mjs
      - name: Validate the secured APNs key without printing it or sending notifications
        env:
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/apns-credential-transfer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nitido-apns-configuration-encrypted
          path: |
            apns-configuration.encrypted.json
            apns-transfer-status.json
          retention-days: 1
          if-no-files-found: error
