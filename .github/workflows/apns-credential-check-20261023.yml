name: Verify NITIDO APNs key inside GitHub (no key export)
on:
  push:
    branches: [codex/nitido-push-20261022]
    paths: ['scripts/apns-credential-check*', '.github/workflows/apns-credential-check-20261023.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test key validation, team binding and absence of key export
        run: node --test scripts/apns-credential-check.test.mjs
      - name: Validate the secured APNs key without printing it or sending notifications
        env:
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/apns-credential-check.mjs
