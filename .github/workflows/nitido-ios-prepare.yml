name: NITIDO iOS release preparation (no public release)
on:
  push:
    branches: [codex/nitido-ios-release-preparation]
    paths:
      - .github/workflows/nitido-ios-prepare.yml
      - scripts/store-ios-prepare.py
permissions:
  contents: read
concurrency:
  group: nitido-ios-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyjwt cryptography
      - name: Inspect existing Apple release
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python scripts/store-ios-prepare.py
