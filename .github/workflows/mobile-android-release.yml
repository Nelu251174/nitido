name: Robot Google Play (semnat + upload)

# Construiește varianta SEMNATĂ (.aab) a aplicației mobile NITIDO și o urcă
# automat pe Google Play, pe canalul de TESTARE INTERNĂ.
#
# Pornire: creezi un tag care începe cu „play-" (ex. play-1, play-2, …).
#   git tag play-1 && git push origin play-1
# (sau manual din Actions, dacă workflow-ul e pe branch-ul implicit).
#
# Necesită aceste SECRETE în GitHub (Settings → Secrets and variables → Actions):
#   NITIDO_KEYSTORE_BASE64          – cheia de semnare (.keystore) codată base64
#   NITIDO_KEYSTORE_PASSWORD        – parola keystore-ului
#   NITIDO_KEY_ALIAS                – alias-ul cheii (ex. nitido-upload)
#   NITIDO_KEY_PASSWORD             – parola cheii
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON – conținutul JSON al contului de serviciu Play
on:
  workflow_dispatch:
  push:
    tags:
      - "play-*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Verifică secretele necesare
        env:
          KS: ${{ secrets.NITIDO_KEYSTORE_BASE64 }}
          SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KS" ] || [ -z "$SA" ]; then
            echo "::error::Lipsesc secretele de semnare/Play. Adaugă NITIDO_KEYSTORE_BASE64 și GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (+ parolele) în Settings → Secrets → Actions."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalează dependințele
        run: npm ci

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (platforma 36)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Decodează cheia de semnare
        run: echo "${{ secrets.NITIDO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nitido-upload.keystore"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build .aab semnat
        env:
          NITIDO_KEYSTORE_PATH: ${{ runner.temp }}/nitido-upload.keystore
          NITIDO_KEYSTORE_PASSWORD: ${{ secrets.NITIDO_KEYSTORE_PASSWORD }}
          # Alias-ul nu e secret (e mereu „nitido-upload"), iar cheia folosește
          # aceeași parolă ca keystore-ul — așa OWNER adaugă doar 3 secrete.
          NITIDO_KEY_ALIAS: nitido-upload
          NITIDO_KEY_PASSWORD: ${{ secrets.NITIDO_KEYSTORE_PASSWORD }}
          # versionCode crește automat cu numărul rulării, ca Play să-l accepte mereu.
          NITIDO_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Publică .aab-ul ca artefact
        uses: actions/upload-artifact@v4
        with:
          name: nitido-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Urcă pe Google Play (canal: testare internă)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ro.nitido.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
