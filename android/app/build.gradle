apply plugin: 'com.android.application'

// Store releases must preserve the existing upload key and use an explicit version.
def isStoreRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (isStoreRelease) {
    ['NITIDO_KEYSTORE_PATH', 'NITIDO_KEYSTORE_PASSWORD', 'NITIDO_KEY_ALIAS', 'NITIDO_KEY_PASSWORD', 'NITIDO_VERSION_CODE'].each { key ->
        if (!System.getenv(key)) throw new GradleException("Missing release configuration: " + key)
    }
    def versionName = System.getenv('NITIDO_VERSION_NAME') ?: '1.0'
    if (!(versionName ==~ /[0-9]+\.[0-9]+(\.[0-9]+)?/)) throw new GradleException('Invalid Android release versionName')
    def code = System.getenv('NITIDO_VERSION_CODE')
    if (!(code ==~ /[1-9][0-9]*/) || new BigInteger(code) > 2100000000) {
        throw new GradleException('Invalid Android release versionCode')
    }
}


android {
    namespace = "ro.nitido.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ro.nitido.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Debug defaults to 1; release requires an explicit code, checked against store evidence before upload.
        def ciVersionCode = System.getenv("NITIDO_VERSION_CODE")
        def ciVersionName = System.getenv("NITIDO_VERSION_NAME")
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 1
        versionName ciVersionName ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Semnare pentru release, alimentată din variabile de mediu (injectate de
    // robotul de build din secretele GitHub). Dacă nu sunt setate — build local
    // sau debug — nu se aplică nicio semnare, deci nimic nu se strică.
    signingConfigs {
        release {
            def ksPath = System.getenv("NITIDO_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("NITIDO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NITIDO_KEY_ALIAS")
                keyPassword System.getenv("NITIDO_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("NITIDO_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
